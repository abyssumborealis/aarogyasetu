<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUEUE — Hospital Patient Flow Intelligence</title>
  <meta name="description" content="Universal hospital crowd telemetry and patient flow intelligence platform connected to FastAPI." />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- Global Operational Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="#landing" class="brand-wrap">
        <div class="brand-symbol">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="brand-text-col">
          <span class="brand-title">QUEUE</span>
          <span class="brand-subtitle">Patient Flow Intelligence</span>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="#hospitals" class="nav-link" id="nav-hospitals">Find a Hospital</a></li>
          <li><a href="#crowd-telemetry" class="nav-link" id="nav-crowd">Hospital Crowd</a></li>
          <li><a href="#how-it-works" class="nav-link" id="nav-how">How It Works</a></li>
          <li><a href="#for-hospitals" class="nav-link" id="nav-hospitals-admin">For Hospitals</a></li>
          <li><a href="#about" class="nav-link" id="nav-about">About</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div id="header-user-badge"></div>
        <div id="system-status-indicator" class="system-status-indicator" title="FastAPI backend connectivity status">
          <span class="dot"></span>
          <span id="system-status-text">INITIALIZING...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Mount (Rendered exclusively by render.js) -->
  <main id="app-mount"></main>

  <!-- Global Modal Mount -->
  <div id="modal-mount"></div>

  <!-- Global Toast Notifications Mount -->
  <div id="toast-mount" class="toast-container"></div>

  <!-- Bottom Simulation Dock Mount -->
  <div id="sim-bar-mount"></div>

  <!-- Application Bootstrapper: store.listeners.add(render); render(); wires clicks -> api.js -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
